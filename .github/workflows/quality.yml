name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce local-only privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'qlogin::(open_web_login|check_web_login|sync_cookies_to_webview)' src-tauri/src/lib.rs; then
            echo 'Web login or cookie synchronization must not be exposed as a Tauri command.' >&2
            exit 1
          fi
          if grep -Eq 'qzone::(open_recycle_password_window|check_recycle_password|close_recycle_password_window|list_recycle_albums|list_recycle_photos|load_recycle_photo_preview|recover_recycle_album|recover_recycle_photos)' src-tauri/src/lib.rs; then
            echo 'Recycle-bin WebView commands inject QQ cookies and must stay disabled in the local-only build.' >&2
            exit 1
          fi
          if grep -REq 'openWebLogin|checkWebLogin|syncCookiesToWebview|LoginCredentials|WebviewWindow' src --include='*.ts' --include='*.vue'; then
            echo 'Frontend must not handle QQ credentials or create QQ login WebViews.' >&2
            exit 1
          fi
          grep -Eq '"devtools"[[:space:]]*:[[:space:]]*false' src-tauri/tauri.conf.json
          if grep -Eiq 'sentry|posthog|segment|google-analytics|appcenter' package.json src-tauri/Cargo.toml; then
            echo 'Telemetry/crash-reporting dependency detected.' >&2
            exit 1
          fi
          echo 'Local-only privacy gate passed.'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run build --prefix website
