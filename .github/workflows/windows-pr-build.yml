name: Windows PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows NSIS installer
        run: npx tauri build --bundles nsis
      - name: Smoke install and checksum
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed with exit code $($process.ExitCode)" }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Path "$bundleDir/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$bundleDir/SHA256SUMS.txt"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-windows-pr-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
